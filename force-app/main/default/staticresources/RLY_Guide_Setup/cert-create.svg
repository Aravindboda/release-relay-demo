<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img"><title>Create a self-signed certificate</title><rect width="800" height="480" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="464" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Setup  ›  Certificate and Key Management  ›  Create Self-Signed Certificate</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Certificate</text><rect x="32" y="88" width="736" height="300" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="88" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Certificate Information</text><text x="56" y="146" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Label</text><rect x="56" y="152" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="171" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">release_relay</text><rect x="50" y="130" width="312" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="376" cy="156" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="376" y="161" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="56" y="206" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Unique Name</text><rect x="56" y="212" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="231" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">release_relay</text><rect x="50" y="190" width="312" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="376" cy="216" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="376" y="221" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="436" y="156" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M439 163 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="458" y="168" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Exportable Private Key</text><rect x="428" y="148" width="210" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="656" cy="163" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="656" y="168" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="436" y="206" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Key Size</text><circle cx="443" cy="225" r="7" fill="#fff" stroke="#0176d3"/><circle cx="443" cy="225" r="3.5" fill="#0176d3"/><text x="458" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">2048</text><circle cx="527" cy="225" r="7" fill="#fff" stroke="#939393"/><text x="542" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">4096</text><rect x="428" y="212" width="160" height="28" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="606" cy="226" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="606" y="231" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="436" y="258" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="458" y="270" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Use Platform Encryption</text><text x="56" y="290" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Leave the other options as they are.</text><rect x="56" y="336" width="57.6" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="84.8" y="356" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Save</text><rect x="130" y="336" width="72.4" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="166.2" y="356" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Cancel</text><rect x="50" y="330" width="76" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="108" cy="322" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="108" y="327" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="32" y="410" width="736" height="28" rx="4" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="42" y="428" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#014486" text-anchor="start">Unique Name is what Release Relay uses: type it exactly, release_relay, lower case.</text></svg>
