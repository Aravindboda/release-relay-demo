<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><title>Pipeline tab: approval rule of an org</title><rect width="800" height="500" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="484" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Release Relay  ›  Pipeline  ›  org card  ›  Edit  ›  Approval</text><rect x="32" y="56" width="736" height="420" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="56" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="76" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Approval</text><text x="48" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Approval rule</text><circle cx="55" cy="129" r="7" fill="#fff" stroke="#939393"/><text x="70" y="134" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Always</text><circle cx="55" cy="157" r="7" fill="#fff" stroke="#0176d3"/><circle cx="55" cy="157" r="3.5" fill="#0176d3"/><text x="70" y="162" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Only when the release contains…</text><circle cx="55" cy="185" r="7" fill="#fff" stroke="#939393"/><text x="70" y="190" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Never: deploy when the checks pass</text><rect x="40" y="116" width="300" height="84" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="356" cy="124" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="356" y="129" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="70" y="220" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">The scan, check-only deploy and tests still have to pass.</text><rect x="70" y="240" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="92" y="252" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Apex classes and triggers</text><rect x="330" y="240" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M333 247 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="352" y="252" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Flows</text><rect x="70" y="266" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="92" y="278" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Profiles and permission sets</text><rect x="330" y="266" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="352" y="278" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Objects and fields</text><rect x="70" y="292" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M73 299 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="304" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Deletions</text><rect x="330" y="292" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="352" y="304" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Manual steps</text><rect x="70" y="318" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M73 325 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="92" y="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Hotfixes</text><rect x="330" y="318" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="352" y="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Anything else</text><rect x="62" y="234" width="520" height="110" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="598" cy="246" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="598" y="251" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="48" y="366" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="70" y="378" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Hotfixes into SIT need 2 approvers</text><rect x="40" y="358" width="290" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="346" cy="372" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="346" y="377" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="48" y="409" width="36" height="18" rx="9" fill="#0176d3" stroke="none" stroke-width="1"/><circle cx="75" cy="418" r="6.5" fill="#fff"/><text x="94" y="422" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Approve in Salesforce</text><rect x="280" y="409" width="36" height="18" rx="9" fill="#939393" stroke="none" stroke-width="1"/><circle cx="289" cy="418" r="6.5" fill="#fff"/><text x="326" y="422" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Approve in Slack</text><rect x="40" y="402" width="430" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="486" cy="416" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="486" y="421" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="520" y="420" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Either is enough.</text><rect x="48" y="446" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="70" y="458" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Also require GitHub reviewers before deploying</text><circle cx="400" cy="452" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="400" y="457" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text></svg>
