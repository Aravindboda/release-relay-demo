<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img"><title>Export the certificate to a keystore</title><rect width="800" height="480" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="464" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Setup  ›  Certificate and Key Management  ›  Export to Keystore</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Certificate and Key Management</text><rect x="32" y="88" width="250.0" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="157.0" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Create Self-Signed Certificate</text><rect x="290.0" y="88" width="235.20000000000002" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="407.6" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Create CA-Signed Certificate</text><rect x="533.2" y="88" width="161.20000000000002" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="613.8000000000001" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Export to Keystore</text><rect x="527.2" y="82" width="173.20000000000002" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="613.8000000000001" cy="140" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="613.8000000000001" y="145" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="702.4000000000001" y="88" width="176.0" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="790.4000000000001" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Import from Keystore</text><rect x="32" y="160" width="736" height="220" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="160" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="180" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Export to Keystore</text><text x="56" y="210" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Exports every certificate in this org to one .jks file, protected by the password.</text><text x="56" y="240" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Keystore Password</text><rect x="56" y="246" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="265" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">••••••••••</text><rect x="50" y="224" width="312" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="376" cy="250" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="376" y="255" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="56" y="300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Confirm Keystore Password</text><rect x="56" y="306" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="325" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">••••••••••</text><rect x="50" y="284" width="312" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="376" cy="310" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="376" y="315" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="440" y="314" width="72.4" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="476.2" y="334" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Export</text><rect x="434" y="308" width="72" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="524" cy="318" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="524" y="323" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="32" y="400" width="736" height="28" rx="4" fill="#fef1cd" stroke="none" stroke-width="1"/><text x="42" y="418" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5e3600" text-anchor="start">You get a .jks file. Keep it and its password safe: the pipeline signs in with them (SF_JKS, SF_JKS_PASSWORD).</text></svg>
