<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"><title>External Client App: OAuth and JWT</title><rect width="800" height="600" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="584" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">The org  ›  Setup  ›  External Client App Manager  ›  New External Client App</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">New External Client App</text><text x="32" y="102" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* External Client App Name</text><rect x="32" y="108" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="40" y="127" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Release Relay Hub</text><circle cx="350" cy="110" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="350" y="115" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="380" y="102" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Contact Email</text><rect x="380" y="108" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="388" y="127" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-w