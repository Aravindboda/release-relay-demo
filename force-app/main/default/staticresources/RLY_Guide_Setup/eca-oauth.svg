oe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Callback URL</text><rect x="260" y="266" width="480" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="268" y="285" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">https://login.salesforce.com/services/oauth2/success</text><circle cx="752" cy="268" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="752" y="273" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="56" y="316" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Selected OAuth Scopes</text><rect x="56" y="324" width="440" height="50" rx="4" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="66" y="344" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Manage user data via APIs (api)</text><text x="66" y="364" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Perform requests at any time (refresh_token, offline_access)</text><rect x="50" y="318" width="452" height="62" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="518" cy="330" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="518" y="335" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="56" y="402" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Flow Enablement</text><rect x="56" y="414" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M59 421 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="78" y="426" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Enable JWT Bearer Flow</text><rect x="48" y="406" width="200" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="264" cy="420" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="264" y="425" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="300" y="410" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="310" y="429" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">release_relay.crt</text><rect x="612" y="409" width="110" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="667.0" y="429" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Upload Files</text><rect x="294" y="404" width="434" height="40" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="744" cy="424" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="744" y="429" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="56" y="476" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">The certificate is the .crt you downloaded from the hub.</text><rect x="32" y="530" width="72.4" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="68.2" y="550" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Create</text><rect x="26" y="524" width="82" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="122" cy="522" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="122" y="527" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text></svg>
