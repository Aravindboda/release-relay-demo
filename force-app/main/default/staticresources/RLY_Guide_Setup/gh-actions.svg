<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img"><title>Let workflows write and open pull requests</title><rect width="800" height="420" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="404" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Git provider  ›  repository  ›  Settings  ›  Actions  ›  General</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Actions permissions</text><rect x="32" y="92" width="736" height="250" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="92" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="112" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Workflow permissions</text><text x="56" y="146" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Choose the default permissions granted to the token when running workflows.</text><circle cx="63" cy="175" r="7" fill="#fff" stroke="#0176d3"/><circle cx="63" cy="175" r="3.5" fill="#0176d3"/><text x="78" y="180" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Read and write permissions</text><rect x="48" y="162" width="250" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="316" cy="176" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="316" y="181" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="78" y="198" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Workflows have read and write permissions in the repository.</text><circle cx="63" cy="225" r="7" fill="#fff" stroke="#939393"/><text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Read repository contents and packages permissions</text><rect x="56" y="268" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M59 275 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="78" y="280" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Allow GitHub Actions to create and approve pull requests</text><rect x="48" y="260" width="420" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="486" cy="274" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="486" y="279" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="56" y="300" width="57.6" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="84.8" y="320" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Save</text><rect x="50" y="294" width="76" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="142" cy="314" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="142" y="319" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="32" y="362" width="736" height="28" rx="4" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="42" y="380" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#014486" text-anchor="start">Without these, the pipeline can't push the release branch or open the pull request.</text></svg>
