<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img"><title>An environment per org, with its login</title><rect width="800" height="560" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="544" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Git provider  ›  repository  ›  Settings  ›  Environments  ›  New environment  ›  sit (example)</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Environments / sit</text><text x="300" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">(name = the org's Git environment)</text><rect x="26" y="52" width="590" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="632" cy="66" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="632" y="71" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="32" y="92" width="360" height="150" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="92" width="360" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="112" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Deployment protection rules</text><rect x="48" y="134" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="70" y="146" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Required reviewers  (recommended for prod)</text><circle cx="376" cy="140" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="376" y="145" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="48" y="182" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Deployment branches and tags</text><text x="48" y="196" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start"></text><rect x="48" y="202" width="200" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="221" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Selected branches</text><path d="M230 213 l5 6 l5 -6" fill="none" stroke="#5c5c5c" stroke-width="1.5"/><text x="260" y="222" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">main</text><circle cx="320" cy="216" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="320" y="221" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="408" y="92" width="360" height="150" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="408" y="92" width="360" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="420" y="112" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">What goes where</text><text x="424" y="146" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Secrets: hidden after you save.</text><text x="424" y="168" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Variables: plain text, visible.</text><text x="424" y="200" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Names are exact, in capitals.</text><rect x="32" y="258" width="736" height="168" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="258" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="278" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Environment secrets</text><rect x="48" y="296" width="680" height="24" rx="0" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="314" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Name</text><text x="256" y="314" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Updated</text><line x1="48" y1="320" x2="728" y2="320" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="338" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_USERNAME</text><text x="256" y="338" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">now</text><line x1="48" y1="344" x2="728" y2="344" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="362" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_CLIENT_ID</text><text x="256" y="362" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">now</text><line x1="48" y1="368" x2="728" y2="368" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="386" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_JKS</text><text x="256" y="386" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">now</text><line x1="48" y1="392" x2="728" y2="392" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="410" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_JKS_PASSWORD</text><text x="256" y="410" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">now</text><line x1="48" y1="416" x2="728" y2="416" stroke="#c9c9c9" stroke-width="1"/><rect x="586" y="263" width="176" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="674.0" y="283" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Add environment secret</text><rect x="580" y="257" width="188" height="38" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="566" cy="254" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="566" y="259" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="32" y="438" width="736" height="106" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="438" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="458" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Environment variables</text><rect x="48" y="474" width="680" height="22" rx="0" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Name</text><text x="256" y="492" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">Value</text><line x1="48" y1="496" x2="728" y2="496" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="514" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_INSTANCE_URL</text><text x="256" y="514" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">https://your-domain.my.salesforce.com</text><line x1="48" y1="518" x2="728" y2="518" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="536" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">SF_JKS_ALIAS</text><text x="256" y="536" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">release_relay</text><line x1="48" y1="540" x2="728" y2="540" stroke="#c9c9c9" stroke-width="1"/><rect x="586" y="443" width="176" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="674.0" y="463" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Add environment variable</text><rect x="580" y="437" width="188" height="38" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="566" cy="434" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="566" y="439" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text></svg>
