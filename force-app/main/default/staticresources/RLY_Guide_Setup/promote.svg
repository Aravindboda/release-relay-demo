<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img"><title>Promote tab: what goes to the next stop</title><rect width="800" height="470" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="454" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Release Relay  ›  Promote</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Promote</text><rect x="32" y="88" width="480" height="330" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="88" width="480" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">SIT  →  PROD  (example)</text><rect x="48" y="128" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M51 135 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="70" y="140" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">REL-00045  Fix quote total</text><rect x="330" y="126" width="55.599999999999994" height="20" rx="10" fill="#fededb" stroke="none" stroke-width="1"/><text x="357.8" y="140" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#8e030f" text-anchor="middle">Hotfix</text><rect x="48" y="164" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M51 171 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="70" y="176" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">REL-00041  Quote layout</text><rect x="48" y="200" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M51 207 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="70" y="212" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">REL-00039  Account region field</text><rect x="48" y="236" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="70" y="248" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">REL-00037  Report folder</text><rect x="40" y="118" width="464" height="150" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="500" cy="112" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="500" y="117" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="48" y="300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Hotfixes first, then the oldest deploy first.</text><text x="48" y="320" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Unticked releases stay in SIT for later.</text><rect x="528" y="88" width="240" height="330" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="528" y="88" width="240" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="540" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">This promotion</text><text x="544" y="142" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">3 releases · 11 components</text><text x="544" y="166" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Tests that run in PROD:</text><text x="544" y="186" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">QuoteServiceTest</text><text x="544" y="204" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">AccountRegionTest</text><rect x="536" y="124" width="224" height="92" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="760" cy="118" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="760" y="123" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="544" y="250" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Title</text><rect x="544" y="256" width="208" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="552" y="275" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">October release (example)</text><circle cx="760" cy="258" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="760" y="263" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="544" y="310" width="208" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="648.0" y="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Promote 3 releases to PROD</text><rect x="538" y="304" width="220" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="760" cy="360" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="760" y="365" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text></svg>
