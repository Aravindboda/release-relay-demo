<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img"><title>Slack in daily use: one card per release</title><rect width="800" height="470" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="454" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Chat workspace  ›  #rr-sit (example)</text><rect x="32" y="56" width="736" height="390" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="48" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#181818" text-anchor="start"># rr-sit</text><line x1="32" y1="96" x2="768" y2="96" stroke="#c9c9c9" stroke-width="1"/><rect x="48" y="112" width="32" height="32" rx="6" fill="#dbe7f7" stroke="none" stroke-width="1"/><text x="92" y="126" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Release Relay  APP</text><rect x="92" y="136" width="460" height="170" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="108" y="160" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">REL-00042 · Account region field (example)</text><text x="108" y="182" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">DEV1 → SIT · Ready for approval</text><text x="108" y="202" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Needs approval: contains a Flow</text><text x="108" y="222" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Tests: AccountRegionTest</text><rect x="108" y="244" width="80" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="148.0" y="264" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Approve</text><rect x="196" y="244" width="70" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="231.0" y="264" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Reject</text><rect x="102" y="238" width="172" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="288" cy="252" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="288" y="257" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="304" y="244" width="160" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="384.0" y="264" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Open in Release Relay</text><rect x="298" y="238" width="172" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="486" cy="252" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="486" y="257" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="92" y="336" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b5cab" text-anchor="start">4 replies</text><text x="160" y="336" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Pull request opened · Checks passed · …</text><rect x="84" y="320" width="420" height="26" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="520" cy="334" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="520" y="339" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="48" y="390" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">The card updates as the release moves; each step goes into its thread.</text><text x="48" y="410" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Approve and Reject show only when the org is approved in Slack and your Slack ID is linked.</text></svg>
