amily="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Only users with RLY_Deploy_Team or RLY_Admin can tick steps.</text><rect x="48" y="330" width="704" height="28" rx="4" fill="#fef1cd" stroke="none" stroke-width="1"/><text x="58" y="348" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5e3600" text-anchor="start">Before deploy steps hold the deploy into that org until they are done. The last tick starts it.</text></svg>
