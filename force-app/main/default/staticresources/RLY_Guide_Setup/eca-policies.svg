<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img"><title>External Client App: pre-authorize the integration user</title><rect width="800" height="520" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="504" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">The org  ›  External Client App Manager  ›  Release Relay Hub  ›  Policies  ›  Edit</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Release Relay Hub</text><rect x="32" y="84" width="736" height="30" fill="#fff"/><text x="40" y="104" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Settings</text><text x="120" y="104" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Policies</text><line x1="110" y1="112" x2="180" y2="112" stroke="#0176d3" stroke-width="3"/><rect x="32" y="124" width="470" height="230" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="124" width="470" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="144" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">OAuth Policies</text><text x="48" y="178" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Permitted Users</text><rect x="48" y="184" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="203" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Admin approved users are pre-authorized</text><path d="M330 195 l5 6 l5 -6" fill="none" stroke="#5c5c5c" stroke-width="1.5"/><rect x="42" y="162" width="312" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="370" cy="186" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="370" y="191" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="48" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">IP Relaxation</text><rect x="48" y="244" width="300" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="56" y="263" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Enforce IP restrictions</text><path d="M330 255 l5 6 l5 -6" fill="none" stroke="#5c5c5c" stroke-width="1.5"/><text x="48" y="300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="start">App Policies</text><rect x="48" y="308" width="200" height="28" rx="4" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="56" y="327" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#181818" text-anchor="start">Profile: your integration profile</text><rect x="42" y="302" width="450" height="40" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="476" cy="296" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="476" y="301" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="260" y="327" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">or a permission set</text><rect x="32" y="370" width="57.6" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="60.8" y="390" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Save</text><rect x="26" y="364" width="76" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="112" cy="362" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="112" y="367" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="520" y="124" width="248" height="230" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="520" y="124" width="248" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="532" y="144" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Settings  ›  OAuth Settings</text><rect x="536" y="176" width="216" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="644.0" y="196" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Consumer Key and Secret</text><rect x="530" y="170" width="228" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="752" cy="166" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="752" y="171" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="536" y="238" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Consumer Key</text><rect x="536" y="246" width="216" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="544" y="265" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">3MVG9…  (copy it)</text><text x="536" y="300" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Salesforce may ask for a</text><text x="536" y="318" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">verification code first.</text><rect x="32" y="430" width="736" height="28" rx="4" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="42" y="448" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#014486" text-anchor="start">Pre-authorized means no one has to log in and click Allow: the hub signs in as the user by itself.</text></svg>
