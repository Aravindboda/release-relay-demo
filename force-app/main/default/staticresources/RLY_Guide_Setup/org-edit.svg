<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img"><title>Pipeline tab: an org card and its Edit window</title><rect width="800" height="590" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="574" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Release Relay  ›  Pipeline  ›  Registered orgs  ›  SIT (example)</text><rect x="32" y="56" width="736" height="120" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="48" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#181818" text-anchor="start">SIT</text><rect x="90" y="70" width="75.4" height="20" rx="10" fill="#ebf7e6" stroke="none" stroke-width="1"/><text x="127.7" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#2e844a" text-anchor="middle">Connected</text><rect x="180" y="70" width="49.0" height="20" rx="10" fill="#eef4ff" stroke="none" stroke-width="1"/><text x="204.5" y="84" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#014486" text-anchor="middle">Stage</text><text x="48" y="112" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Branch sit · Git environment sit · Full Copy sandbox · Approval: Always (example)</text><rect x="48" y="130" width="116.80000000000001" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="106.4" y="150" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Test sign-in</text><rect x="42" y="124" width="116" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="172" cy="130" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="172" y="135" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="196" y="130" width="153.8" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="272.9" y="150" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Send test message</text><rect x="660" y="130" width="90" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="705.0" y="150" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Edit</text><rect x="654" y="124" width="102" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="760" cy="120" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="760" y="125" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="400" y="150" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Read-only card. Edit opens the window below.</text><rect x="80" y="192" width="640" height="384" rx="6" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="400" y="220" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#181818" text-anchor="middle">Edit SIT</text><line x1="80" y1="234" x2="720" y2="234" stroke="#c9c9c9" stroke-width="1"/><rect x="96" y="246" width="608" height="24" rx="4" fill="#f3f3f3" stroke="none" stroke-width="1"/><text x="106" y="263" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Sign-in</text><text x="104" y="290" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Connected app consumer key</text><rect x="104" y="296" width="290" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="112" y="315" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#939393" text-anchor="start">Leave blank to keep the saved key</text><rect x="98" y="274" width="302" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="412" cy="286" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="412" y="291" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="420" y="290" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Integration username</text><rect x="420" y="296" width="270" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="428" y="315" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#939393" text-anchor="start">relay@yourorg.dev</text><rect x="96" y="340" width="608" height="24" rx="4" fill="#f3f3f3" stroke="none" stroke-width="1"/><text x="106" y="357" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Approval</text><text x="104" y="386" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Approval rule, approvers and where it is approved (see Approval rules)</text><rect x="96" y="402" width="608" height="24" rx="4" fill="#f3f3f3" stroke="none" stroke-width="1"/><text x="106" y="419" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#181818" text-anchor="start">Slack</text><text x="104" y="446" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Slack channel</text><rect x="104" y="452" width="290" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="112" y="471" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">#rr-sit</text><rect x="98" y="430" width="302" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="412" cy="442" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="412" y="447" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="440" y="457" width="36" height="18" rx="9" fill="#0176d3" stroke="none" stroke-width="1"/><circle cx="467" cy="466" r="6.5" fill="#fff"/><text x="486" y="470" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Post to Slack</text><rect x="432" y="450" width="160" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="608" cy="464" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="608" y="469" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><line x1="80" y1="512" x2="720" y2="512" stroke="#c9c9c9" stroke-width="1"/><text x="104" y="548" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">Nothing changes until you press Save.</text><rect x="560" y="530" width="72.4" height="30" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="596.2" y="550" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#0b5cab" text-anchor="middle">Cancel</text><rect x="638" y="530" width="57.6" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="666.8" y="550" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Save</text><rect x="632" y="524" width="72" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="618" cy="520" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="618" y="525" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text></svg>
