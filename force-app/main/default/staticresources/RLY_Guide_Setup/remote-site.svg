<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"><title>Add a Remote Site Setting</title><rect width="800" height="400" fill="#f3f3f3"/><rect x="8" y="8" width="784" height="384" rx="8" fill="#fff" stroke="#c9c9c9"/><rect x="8" y="8" width="784" height="34" rx="8" fill="#e9eef5"/><rect x="8" y="34" width="784" height="8" fill="#e9eef5"/><circle cx="26" cy="25" r="5" fill="#c9c9c9"/><circle cx="42" cy="25" r="5" fill="#c9c9c9"/><circle cx="58" cy="25" r="5" fill="#c9c9c9"/><text x="76" y="30" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" fill="#5c5c5c">Setup  ›  Security  ›  Remote Site Settings  ›  New Remote Site</text><text x="32" y="72" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#181818" text-anchor="start">Remote Site Edit</text><rect x="32" y="88" width="736" height="230" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><rect x="32" y="88" width="736" height="30" rx="4" fill="#fafaf9" stroke="#c9c9c9" stroke-width="1"/><text x="44" y="108" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#181818" text-anchor="start">Remote Site Details</text><text x="56" y="146" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Remote Site Name</text><rect x="56" y="152" width="340" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="171" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">RLY_Org_SIT  (example)</text><rect x="50" y="130" width="352" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="418" cy="156" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="418" y="161" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="56" y="206" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">* Remote Site URL</text><rect x="56" y="212" width="560" height="28" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1"/><text x="64" y="231" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#181818" text-anchor="start">https://your-domain.my.salesforce.com</text><rect x="50" y="190" width="572" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="640" cy="216" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="640" y="221" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="56" y="256" width="15" height="15" rx="3" fill="#fff" stroke="#939393" stroke-width="1"/><text x="78" y="268" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Disable Protocol Security</text><rect x="300" y="256" width="15" height="15" rx="3" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><path d="M303 263 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="322" y="268" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#181818" text-anchor="start">Active</text><rect x="292" y="248" width="90" height="30" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="398" cy="262" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="398" y="267" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="32" y="340" width="57.6" height="30" rx="4" fill="#0176d3" stroke="#0176d3" stroke-width="1"/><text x="60.8" y="360" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Save</text><rect x="26" y="334" width="76" height="42" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 3"/><circle cx="112" cy="330" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="112" y="335" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="140" y="360" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start">One Remote Site per registered org, the hub itself included.</text></svg>
