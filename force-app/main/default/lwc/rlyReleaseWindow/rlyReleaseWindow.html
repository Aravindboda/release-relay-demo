<template>
    <div class="rr-win" role="group" aria-label="Release window">
        <div class="rr-win-head">
            <h3 class="rr-h3 rr-grow">Release window</h3>
            <span class={stateCls}>{stateLabel}</span>
            <template lwc:if={showEdit}><lightning-button label="Edit" onclick={startEdit}></lightning-button></template>
        </div>
        <template lwc:if={editing}>
            <div class="rr-win-form">
                <c-rly-choice-chips label="Deploys allowed on" options={dayOptions} value={form.days} onchange={handleDays}></c-rly-choice-chips>
                <p class="rr-kicker">No day chosen: no window, deploys run any time (freezes still apply).</p>
                <div class="rr-win-grid">
                    <lightning-input type="time" label="From" value={form.fromTime} data-field="fromTime" onchange={handleField}
                        field-level-help="Blank From and To: the whole day."></lightning-input>
                    <lightning-input type="time" label="To" value={form.toTime} data-field="toTime" onchange={handleField}></lightning-input>
                    <lightning-combobox label="Time zone" value={form.timeZone} options={zoneOptions} data-field="timeZone" onchange={handleField}
                        placeholder="For example America/Chicago"></lightning-combobox>
                </div>
                <template lwc:if={overnight}><p class="rr-kicker">To is earlier than From: the window runs past midnight into the next day.</p></template>
                <h4 class="rr-win-sub">Freezes</h4>
                <template lwc:if={hasFormFreezes}>
                    <template for:each={formFreezes} for:item="f">
                        <div key={f.key} class="rr-win-freeze">
                            <lightning-input type="date" label="From" value={f.fromDate} data-key={f.key} data-field="fromDate" onchange={handleFreeze}></lightning-input>
                            <lightning-input type="date" label="To" value={f.toDate} data-key={f.key} data-field="toDate" onchange={handleFreeze}></lightning-input>
                            <lightning-input label="Reason" value={f.reason} max-length="120" data-key={f.key} data-field="reason" onchange={handleFreeze}
                                placeholder="For example Year-end close"></lightning-input>
                            <lightning-button-icon icon-name="utility:delete" alternative-text="Remove this freeze" title="Remove this freeze"
                                data-key={f.key} onclick={removeFreeze} class="rr-win-del"></lightning-button-icon>
                        </div>
                    </template>
                </template>
                <template lwc:else><p class="rr-kicker">No freezes.</p></template>
                <div class="rr-win-actions">
                    <lightning-button label="Add a freeze" icon-name="utility:add" onclick={addFreeze}></lightning-button>
                    <span class="rr-grow"></span>
                    <lightning-button label="Cancel" onclick={cancelEdit} disabled={saving}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={save} disabled={saving}></lightning-button>
                </div>
                <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>
            </div>
        </template>
        <template lwc:else>
            <p class="rr-win-summary">{summary}</p>
            <p class="rr-kicker">{stateText}</p>
            <template lwc:if={hasFreezes}>
                <ul class="rr-win-list" aria-label="Freezes">
                    <template for:each={freezeRows} for:item="r"><li key={r.key}>{r.text}</li></template>
                </ul>
            </template>
            <p class="rr-kicker">An approved release outside the window waits (Waiting for the window) and deploys when a page reads it inside the window; in a freeze it is held. Someone with the Release Window Bypass add-on can Deploy now anyway, with a reason.</p>
        </template>
    </div>
</template>
