<template>
    <!-- design board: b49 section 3 -->
    <section class="rr-cr" aria-label="Credentials">
        <div class="rr-cr-head">
            <div class="rr-grow">
                <h2 class="rr-h2">Credentials</h2>
                <p class="rr-small rr-weak">{subtitle}</p>
            </div>
            <template for:each={pills} for:item="p"><span key={p.key} class={p.cls}>{p.text}</span></template>
            <template lwc:if={canCheck}><lightning-button label={checkLabel} onclick={checkNow} disabled={busy}></lightning-button></template>
        </div>
        <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>
        <template lwc:if={message}><div class="rr-msg rr-msg-ok" role="status">{message}</div></template>
        <template lwc:if={busy}><p class="rr-small rr-weak" role="status">Checking every certificate, token and sign-in… this can take a minute.</p></template>
        <template lwc:if={hasRows}>
            <div class="rr-table" role="table" aria-label="Credentials">
                <div class="rr-tr rr-hd" role="row">
                    <span role="columnheader">Kind</span><span role="columnheader">Name</span><span role="columnheader">Status</span>
                    <span role="columnheader">Expires</span><span role="columnheader">Days left</span><span role="columnheader">Last checked</span>
                    <span role="columnheader">Message · how to renew</span>
                </div>
                <template for:each={rows} for:item="r">
                    <div key={r.key} class="rr-tr" role="row">
                        <span role="cell" class="rr-small">{r.kind}</span>
                        <span role="cell" class="rr-break"><span class="rr-strong">{r.name}</span></span>
                        <span role="cell"><span class={r.pillCls}>{r.status}</span></span>
                        <span role="cell" class="rr-small">{r.expiresText}</span>
                        <span role="cell" class="rr-small">{r.daysText}</span>
                        <span role="cell" class="rr-small rr-weak" title={r.lastOkText}>{r.checkedText}</span>
                        <span role="cell" class="rr-small rr-break">
                            <template lwc:if={r.message}><span class="rr-block">{r.message}</span></template>
                            <template lwc:if={r.showRenew}><span class="rr-block"><span class="rr-strong">How to renew: </span>{r.renew}</span></template>
                        </span>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:if={noRows}><p class="rr-small rr-weak">{noRowsText}</p></template>
        <p class="rr-small rr-weak rr-pb">Checked nightly with the pipeline's archive call; at most about 40 calls a pass, so a hub with many orgs carries on the next night, oldest checked first. Slack (when on) gets one message when something turns Critical, Expired or Failed.</p>
    </section>
</template>
