<template>
    <div class="rr-page slds-is-relative">
        <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
        <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>

        <template lwc:if={detail}>
            <section class="rr-card">
                <div class="rr-card-head rr-row">
                    <div class="rr-grow">
                        <p class="rr-kicker">{rel.Name}</p>
                        <h2 class="rr-title">{rel.Title__c}</h2>
                        <p class="rr-small rr-weak">{route} · {raisedText}</p>
                    </div>
                    <span class={statusCls}>{rel.Status__c}</span>
                    <template lwc:if={rel.PR_URL__c}>
                        <a class="rr-link" href={rel.PR_URL__c} target="_blank" rel="noopener">{prLabel}</a>
                    </template>
                    <template lwc:if={rel.Run_URL__c}>
                        <a class="rr-link" href={rel.Run_URL__c} target="_blank" rel="noopener">Pipeline run</a>
                    </template>
                </div>

                <template lwc:if={errorBanner}><div class="rr-msg rr-msg-bad rr-pad-top" role="alert">{errorBanner}</div></template>

                <ol class="rr-timeline" aria-live="polite">
                    <template for:each={steps} for:item="s">
                        <li key={s.key} class={s.cls}>
                            <span class="rr-tl-badge" aria-hidden="true">{s.badge}</span>
                            <div class="rr-tl-body">
                                <p class="rr-tl-title">{s.title} <span class="rr-tl-state">{s.stateLabel}</span></p>
                                <p class="rr-small rr-weak">{s.text}</p>
                            </div>
                        </li>
                    </template>
                </ol>
                <div class="rr-sync rr-pad-x" aria-live="off">
                    <span class="rr-small rr-weak">{syncedText}</span>
                    <template lwc:if={running}>
                        <span class="rr-small rr-weak">· {countdownText}</span>
                        <template lwc:if={counting}>
                            <span class="rr-meter" aria-hidden="true">
                                <template for:each={cycles} for:item="c">
                                    <span key={c.key} class="rr-meter-fill" onanimationend={handleCountdownEnd}></span>
                                </template>
                            </span>
                        </template>
                    </template>
                    <lightning-button variant="base" label="Check now" onclick={refresh} disabled={checking}></lightning-button>
                </div>

                <template lwc:if={hasViolations}>
                    <div class="rr-pad-all">
                        <p class="rr-label">Code scan findings</p>
                        <div class="rr-scroll">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered rr-table">
                                <thead><tr><th scope="col">Severity</th><th scope="col">Rule</th><th scope="col">Where</th><th scope="col">Finding</th></tr></thead>
                                <tbody>
                                    <template for:each={violations} for:item="v">
                                        <tr key={v.key}>
                                            <td><span class={v.sevCls}>{v.severityLabel}</span></td>
                                            <td class="rr-small">{v.rule}</td>
                                            <td class="rr-mono">{v.where}</td>
                                            <td class="rr-small rr-wrap">{v.message}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <template lwc:if={hasProblems}>
                    <div class="rr-pad-all">
                        <p class="rr-label">Deployment errors</p>
                        <ul class="rr-problems">
                            <template for:each={problems} for:item="p">
                                <li key={p.key}><span class="rr-mono">{p.what}</span> <span class="rr-small">{p.message}</span></li>
                            </template>
                        </ul>
                    </div>
                </template>

                <div class="rr-pad-all">
                    <lightning-button variant="base" label={itemsLabel} onclick={toggleItems}></lightning-button>
                    <template lwc:if={showItems}>
                        <ul class="rr-items">
                            <template for:each={items} for:item="i"><li key={i.key} class="rr-mono">{i.text}</li></template>
                        </ul>
                    </template>
                </div>

                <template lwc:if={hasActions}>
                    <div class="rr-actions">
                        <template lwc:if={canBypass}>
                            <div class="rr-col">
                                <p class="rr-small"><strong>Code scan blocked this release.</strong> As an approver you can accept the findings with a reason.<template lwc:if={validationBlocks}> The validation failed too, and that can't be bypassed: fix it and raise again.</template></p>
                                <lightning-textarea label="Why the findings are accepted" value={reason} onchange={handleReason} max-length="2000"></lightning-textarea>
                                <div><lightning-button label="Bypass code scan" onclick={doBypass} disabled={busy}></lightning-button></div>
                            </div>
                        </template>
                        <template lwc:if={canReject}>
                            <lightning-textarea label="Approval comment" value={comment} onchange={handleComment} max-length="2000"
                                placeholder="Required to reject"></lightning-textarea>
                        </template>
                        <div class="rr-row rr-end-row">
                            <template lwc:if={canCheckAgain}><lightning-button label="Check again" onclick={doCheckAgain} disabled={busy}></lightning-button></template>
                            <template lwc:if={canReject}><lightning-button variant="destructive-text" label="Reject" onclick={doReject} disabled={busy}></lightning-button></template>
                            <template lwc:if={canApprove}><lightning-button variant="brand" label="Approve and deploy" onclick={doApprove} disabled={busy}></lightning-button></template>
                        </div>
                    </div>
                </template>
                <template lwc:if={needsApproverNote}>
                    <p class="rr-small rr-weak rr-pad-all">An approver approves or rejects it on the Approvals tab.</p>
                </template>
            </section>
        </template>
    </div>
</template>
