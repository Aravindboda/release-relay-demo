<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="rr-bd-title" aria-describedby="rr-bd-intro"
        class="slds-modal slds-fade-in-open slds-modal_large rr-modal" onkeydown={handleKeydown}>
        <div class="slds-modal__container rr-modal-container">
            <button type="button" class="slds-button slds-button_icon slds-modal__close rr-close" title="Close" onclick={close}>
                <lightning-icon icon-name="utility:close" size="small" variant="inverse" alternative-text="Close"></lightning-icon>
            </button>
            <div class="slds-modal__header rr-modal-head">
                <h1 id="rr-bd-title" class="slds-modal__title rr-title">{heading}</h1>
                <p id="rr-bd-intro" class="rr-small rr-weak">{intro}</p>
            </div>
            <div class="slds-modal__content rr-modal-body">
                <template lwc:if={error}>
                    <div class="rr-msg rr-msg-bad" role="alert">{error}</div>
                </template>
                <div class="rr-prog" role="status" aria-live="polite">
                    <strong>{progressText}</strong>
                    <span class="rr-bar" aria-hidden="true"><i style={barStyle}></i></span>
                    <template lwc:if={busy}><span class="rr-spin"><lightning-spinner alternative-text="Reading" size="x-small"></lightning-spinner></span></template>
                </div>
                <template lwc:if={truncated}><div class="rr-msg rr-msg-info">{truncatedText}</div></template>
                <template lwc:if={hasFailures}>
                    <ul class="rr-fails" aria-label="Parts that couldn't be read">
                        <template for:each={failureRows} for:item="f">
                            <li key={f.key} class="rr-msg rr-msg-bad rr-fail">
                                <span class="rr-grow">{f.text}</span>
                                <lightning-button label="Try again" data-key={f.key} onclick={retry} disabled={busy}></lightning-button>
                            </li>
                        </template>
                    </ul>
                </template>

                <div class="rr-bar-row">
                    <c-rly-search-box class="rr-grow" label="Search the branch" placeholder={searchHint} shown={shownCount} total={totalCount}
                        onsearch={handleSearch}></c-rly-search-box>
                    <div class="rr-segs" role="group" aria-label="Show">
                        <button type="button" class={allCls} aria-pressed={allPressed} onclick={showAll}>All</button>
                        <button type="button" class={chosenCls} aria-pressed={chosenPressed} onclick={showChosen}>{chosenTabLabel}</button>
                    </div>
                </div>

                <div class="rr-split">
                    <nav class="rr-types" aria-label="Types">
                        <template for:each={types} for:item="t">
                            <button key={t.key} type="button" class={t.cls} aria-pressed={t.pressed} data-key={t.key} onclick={pickType}>
                                <span class="rr-grow rr-ellipsis">{t.label}</span><span class="rr-weak">{t.count}</span>
                            </button>
                        </template>
                    </nav>
                    <div class="rr-rows">
                        <div class="rr-row rr-row-head" aria-hidden="true">
                            <span>On the {targetBranch} branch</span><span>In {sourceName}</span><span>Delete</span>
                        </div>
                        <template lwc:if={hasRows}>
                            <template for:each={rows} for:item="r">
                                <div key={r.key} class={r.rowCls}>
                                    <div class="rr-name">
                                        <strong class="rr-mono"><template for:each={r.nameParts} for:item="p"><template lwc:if={p.hit}><mark key={p.key}>{p.text}</mark></template><template lwc:else><span key={p.key}>{p.text}</span></template></template></strong>
                                        <span class="rr-small rr-weak">{r.typeLabel}</span>
                                        <template lwc:if={r.reason}><span class="rr-small rr-reason">{r.reason}</span></template>
                                    </div>
                                    <div><template lwc:if={r.hasTag}><span class={r.tagCls}>{r.tag}</span></template></div>
                                    <div>
                                        <template lwc:if={r.canChoose}>
                                            <button type="button" class={r.chipCls} aria-pressed={r.pressed} aria-label={r.chipAria} data-key={r.key} onclick={toggle}>{r.chipLabel}</button>
                                        </template>
                                        <template lwc:elseif={r.inRelease}><span class="rr-pill rr-pill-bad">In release</span></template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:if={hasMore}>
                                <div class="rr-more"><button type="button" class="rr-textbtn" onclick={showMore}>{moreText}</button></div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="rr-empty rr-small rr-weak">{emptyText}</p>
                        </template>
                    </div>
                </div>
                <template lwc:if={hasStillWarning}><div class="rr-msg rr-msg-warn" role="status">{stillWarning}</div></template>
            </div>
            <div class="slds-modal__footer rr-modal-foot">
                <span class="rr-grow rr-small"><strong>{footText}</strong> <span class="rr-weak">{limitText}</span></span>
                <lightning-button label="Cancel" onclick={close}></lightning-button>
                <lightning-button variant="brand" label={addLabel} onclick={add} disabled={noneChosen}></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
