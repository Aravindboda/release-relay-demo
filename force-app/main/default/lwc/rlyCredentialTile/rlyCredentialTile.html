<template>
    <!-- design board: b49 section 4 -->
    <template lwc:if={loaded}>
        <section class="rr-ct" aria-label="Credentials">
            <span class="rr-ct-title">Credentials</span>
            <template lwc:if={allOk}>
                <span class="rr-pill rr-pill-ok">All credentials OK</span>
                <span class="rr-small rr-weak">{checkedText}</span>
            </template>
            <template lwc:if={notChecked}><span class="rr-small rr-weak">Not checked yet: they are checked nightly with the archive call.</span></template>
            <template lwc:if={hasProblems}>
                <ul class="rr-ct-list">
                    <template for:each={problems} for:item="p">
                        <li key={p.key}><span class={p.pillCls}>{p.status}</span><span class="rr-ct-name">{p.text}</span></li>
                    </template>
                </ul>
                <span class="rr-small rr-weak">{checkedText}</span>
            </template>
            <span class="rr-grow"></span>
            <template lwc:if={isAdmin}><button type="button" class="rr-link" onclick={openPipeline}>Pipeline ›</button></template>
        </section>
    </template>
</template>
