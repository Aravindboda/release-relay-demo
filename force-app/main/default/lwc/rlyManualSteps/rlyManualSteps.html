<template>
    <!-- board HubManualSteps: 1 (New Release review, draft) and 2 (the release page card) -->
    <template lwc:if={visible}>
        <section class={cardCls} aria-label="Manual steps">
            <div class={headCls}>
                <h2 class="rr-h2 rr-grow">Manual steps</h2>
                <template lwc:if={showHeadPill}><span class={headPillCls}>{headPill}</span></template>
            </div>

            <div class="rr-bd slds-is-relative">
                <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
                <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>
                <template lwc:if={showIntro}><p class="rr-small rr-weak">{introText}</p></template>

                <!-- per org: tabs and the ordered checklist -->
                <template lwc:if={hasOrgs}>
                    <div class="slds-tabs_default">
                        <ul class="slds-tabs_default__nav rr-tabs" role="tablist" aria-label="Orgs">
                            <template for:each={tabs} for:item="t">
                                <li key={t.key} class={t.cls} role="presentation">
                                    <button type="button" class="slds-tabs_default__link rr-tab" role="tab" aria-selected={t.selected} tabindex={t.tabIndex}
                                        data-id={t.orgId} onclick={pickOrg} onkeydown={tabKey}>{t.name}<span class={t.countCls}>{t.count}</span></button>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <div role="tabpanel" aria-label={panelLabel} class="rr-col">
                        <template lwc:if={loginLink}>
                            <div class="rr-row rr-end">
                                <a class="slds-button slds-button_neutral rr-login" href={loginLink.url} target="_blank" rel="noopener noreferrer" title={loginLink.title}>{loginLink.label}</a>
                            </div>
                        </template>
                        <template lwc:if={gateText}><div class="rr-msg rr-msg-warn" role="status">{gateText}</div></template>
                        <template lwc:if={hasRuns}>
                            <template lwc:if={showSearch}>
                                <c-rly-search-box label="Search manual steps" placeholder="Search by step, category or person" shown={shownCount} total={runCount}
                                    onsearch={handleSearch}></c-rly-search-box>
                            </template>
                            <div class="rr-scroll">
                            <ol class="rr-ms-list">
                                <template for:each={shownRuns} for:item="r">
                                    <li key={r.key} class="rr-ms">
                                        <span class={r.boxCls} role="img" aria-label={r.boxLabel}>{r.boxGlyph}</span>
                                        <span class="rr-no" aria-hidden="true">{r.no}</span>
                                        <div class="rr-ms-body">
                                            <p class="rr-row"><strong><template for:each={r.titleParts} for:item="u"><template lwc:if={u.hit}><mark key={u.key}>{u.text}</mark></template><template lwc:else><span key={u.key}>{u.text}</span></template></template></strong><span class={r.timingCls}>{r.timingLabel}</span><span class="rr-pill rr-pill-cat">{r.categoryLabel}</span>
                                                <template lwc:if={r.statusLabel}><span class={r.statusCls}>{r.statusLabel}</span></template></p>
                                            <template lwc:if={r.expanded}><div class="rr-instr">{r.instructions}</div></template>
                                            <p class="rr-small rr-weak rr-meta">
                                                <template lwc:if={r.hasInstructions}>
                                                    <button type="button" class="slds-button rr-link" data-id={r.id} onclick={toggleInstructions} aria-expanded={r.ariaExpanded}>{r.toggleLabel}</button>
                                                </template>
                                                <span>{r.metaText}</span>
                                            </p>
                                            <!-- board HubStepFiles 2: the step's files (locked after approval) -->
                                            <template lwc:if={r.showStepFiles}>
                                                <c-rly-step-files label="Step files" files={r.stepFiles} record-id={r.stepId} can-attach={r.stepCanAttach} locked={r.stepLocked}
                                                    lock-text={r.stepLockText} release-id={releaseId} org-id={selectedOrgId} disabled={actDisabled} upload-label="Attach files"
                                                    onuploaded={handleFilesChanged} onremove={handleFileRemove}></c-rly-step-files>
                                            </template>
                                            <!-- this org's run: To do | Done | Not needed, and its proof -->
                                            <div class="rr-run">
                                                <div class="rr-run-hd">
                                                    <span class="rr-run-org">{r.inOrgLabel}</span>
                                                    <div class="rr-seg" role="radiogroup" aria-label={r.segLabel}>
                                                        <template for:each={r.segments} for:item="g">
                                                            <button key={g.value} type="button" role="radio" class={g.cls} aria-checked={g.pressed} title={g.label}
                                                                data-id={r.id} data-status={g.value} onclick={pickStatus} disabled={g.off}><span class="rr-seg-full">{g.label}</span><span class="rr-seg-short">{g.short}</span></button>
                                                        </template>
                                                    </div>
                                                    <span class="rr-small rr-weak rr-run-who">{r.whoText}</span>
                                                </div>
                                                <template lwc:if={r.noting}>
                                                    <div class="rr-note">
                                                        <lightning-input label="Why it isn't needed in this org" value={noteText} max-length="255" required onchange={handleNote}></lightning-input>
                                                        <div class="rr-row rr-end">
                                                            <lightning-button label="Cancel" onclick={cancelNote}></lightning-button>
                                                            <lightning-button variant="brand" label="Mark not needed" onclick={saveNote} disabled={noteMissing}></lightning-button>
                                                        </div>
                                                    </div>
                                                </template>
                                                <c-rly-step-files label={r.proofLabel} files={r.proof} record-id={r.id} can-attach={r.canAddProof} release-id={releaseId}
                                                    org-id={selectedOrgId} disabled={actDisabled} upload-label="Add proof" empty-text={r.proofEmpty} compact
                                                    onuploaded={handleFilesChanged} onremove={handleFileRemove}></c-rly-step-files>
                                            </div>
                                        </div>
                                    </li>
                                </template>
                            </ol>
                            <template lwc:if={noMatch}>
                                <p class="rr-nomatch-p">{noMatchText} <button type="button" class="rr-linkbtn" onclick={clearSearch}>Clear search</button></p>
                            </template>
                            </div>
                        </template>
                        <template lwc:else><p class="rr-small rr-weak">{noRunsText}</p></template>
                        <p class="rr-small rr-weak">{checkNote}</p>
                    </div>
                </template>

                <!-- the steps themselves: ordered, with up / down, edit and delete for those who may edit -->
                <template lwc:if={showDefinitions}>
                    <div class="rr-defs">
                        <template lwc:if={definitionsTitle}><p class="rr-label">{definitionsTitle}</p></template>
                        <template lwc:if={hasStepRows}>
                            <ol class="rr-ms-list rr-scroll">
                                <template for:each={stepRows} for:item="s">
                                    <li key={s.key} class="rr-ms">
                                        <span class="rr-no" aria-hidden="true">{s.no}</span>
                                        <div class="rr-ms-body">
                                            <p class="rr-row"><strong>{s.title}</strong><span class={s.timingCls}>{s.timingLabel}</span><span class="rr-pill rr-pill-cat">{s.categoryLabel}</span></p>
                                            <p class="rr-small rr-weak">{s.whereText}</p>
                                            <template lwc:if={s.showFiles}>
                                                <c-rly-step-files label={s.filesLabel} files={s.fileRows} record-id={s.fileRecordId} can-attach={s.fileCanAttach}
                                                    locked={s.fileLocked} lock-text={s.fileLockText} release-id={releaseId} disabled={addDisabled} upload-label="Attach files"
                                                    data-key={s.key} onuploaded={handleDefinitionFiles} onremove={handleDefinitionRemove}></c-rly-step-files>
                                            </template>
                                        </div>
                                        <template lwc:if={s.canEdit}>
                                            <lightning-button-group>
                                                <lightning-button-icon icon-name="utility:arrowup" variant="border-filled" size="small" alternative-text={s.upLabel} title={s.upLabel}
                                                    data-key={s.key} onclick={moveUp} disabled={s.upDisabled}></lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:arrowdown" variant="border-filled" size="small" alternative-text={s.downLabel} title={s.downLabel}
                                                    data-key={s.key} onclick={moveDown} disabled={s.downDisabled}></lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:edit" variant="border-filled" size="small" alternative-text={s.editLabel} title={s.editLabel}
                                                    data-key={s.key} onclick={editStep} disabled={s.editDisabled}></lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:close" variant="border-filled" size="small" alternative-text={s.deleteLabel} title={s.deleteLabel}
                                                    data-key={s.key} onclick={removeStep} disabled={s.editDisabled}></lightning-button-icon>
                                            </lightning-button-group>
                                        </template>
                                    </li>
                                </template>
                            </ol>
                        </template>

                        <template lwc:if={formOpen}>
                            <div class="rr-form" role="group" aria-label={formTitle}>
                                <p class="rr-label rr-cap">{formTitle}</p>
                                <lightning-input label="Title" value={form.title} max-length="120" required data-field="title" onchange={handleText}
                                    placeholder="For example: Give a profile access to a new field"></lightning-input>
                                <div class="rr-grid2">
                                    <lightning-combobox label="Category" value={form.category} options={categoryOptions} data-field="category" onchange={handleField}></lightning-combobox>
                                    <lightning-radio-group type="button" label="When" value={form.timing} options={timingOptions} data-field="timing" onchange={handleField}></lightning-radio-group>
                                </div>
                                <lightning-textarea label="Instructions" value={form.instructions} max-length="32768" data-field="instructions" onchange={handleText}
                                    placeholder="What exactly to do, for example: Profile Sales User: Account.Region__c read/edit"></lightning-textarea>
                                <template lwc:if={showFormFiles}>
                                    <c-rly-step-files label="" files={formFileRows} record-id={formFileRecordId} can-attach={formCanAttach} disabled={busy}
                                        upload-label="Attach files" onuploaded={handleFormFiles} onremove={handleFormFileRemove}></c-rly-step-files>
                                </template>
                                <lightning-input type="toggle" label="Also in back promote orgs" checked={form.backPromote} data-field="backPromote" onchange={handleField}
                                    message-toggle-active="" message-toggle-inactive=""></lightning-input>
                                <lightning-radio-group type="button" label="Orgs" value={form.scopeMode} options={scopeOptions} data-field="scopeMode" onchange={handleField}></lightning-radio-group>
                                <template lwc:if={isPick}>
                                    <lightning-checkbox-group label="Only in these orgs" options={pickOptions} value={form.scopeOrgs} data-field="scopeOrgs" onchange={handleField}
                                        required></lightning-checkbox-group>
                                </template>
                                <template lwc:if={formError}><div class="rr-msg rr-msg-bad" role="alert">{formError}</div></template>
                                <div class="rr-row rr-end">
                                    <lightning-button label="Cancel" onclick={cancelForm} disabled={busy}></lightning-button>
                                    <lightning-button variant="brand" label={formSaveLabel} onclick={saveForm} disabled={formCantSave}></lightning-button>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={showDraftFilesNote}><p class="rr-msg rr-msg-info">{draftFilesNote}</p></template>
                        <template lwc:if={canAdd}>
                            <div><lightning-button label="Add a manual step" icon-name="utility:add" onclick={openForm} disabled={addDisabled}></lightning-button></div>
                        </template>
                    </div>
                </template>
            </div>
        </section>
    </template>
</template>
