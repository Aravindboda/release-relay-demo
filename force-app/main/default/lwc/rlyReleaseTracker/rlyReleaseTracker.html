<template>
    <template lwc:if={statusRead}>
        <c-rly-org-gate status={hubStatus}></c-rly-org-gate>
        <template lwc:if={showPage}>
            <div class="rr-page">
                <template lwc:if={hubCopy}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                        <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning" class="slds-m-right_x-small"></lightning-icon>
                        <h2>{hubCopyMessage}</h2>
                    </div>
                </template>
                <!-- header: icon, eyebrow, title, primary action -->
                <section class="rr-head">
                    <span class="rr-head-icon"><lightning-icon icon-name={icon} size="small" variant="inverse" alternative-text=""></lightning-icon></span>
                    <div class="rr-head-text">
                        <p class="rr-kicker">Releases</p>
                        <h1 class="rr-title">{heading}</h1>
                    </div>
                    <template lwc:if={showNewRelease}>
                        <lightning-button variant="brand" label="New release" onclick={newRelease}></lightning-button>
                    </template>
                </section>

                <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>

                <!-- filters: Raised by (Releases tab), state chips with counts, search; then the live check line -->
                <section class="rr-filters" aria-label="Filters">
                    <template lwc:if={isReleases}>
                        <div class="rr-raised">
                            <lightning-record-picker label="Raised by" placeholder="Everyone" object-api-name="User" value={raisedById}
                                onchange={handleRaisedBy}></lightning-record-picker>
                        </div>
                    </template>
                    <div class="rr-chips" role="group" aria-label="Status">
                        <template for:each={chips} for:item="c">
                            <button key={c.id} type="button" class={c.cls} data-id={c.id} aria-pressed={c.on} title={c.title} onclick={pickChip}>{c.label} <span class="rr-count">{c.count}</span></button>
                        </template>
                    </div>
                    <div class="rr-search">
                        <lightning-input type="search" label="Search releases" variant="label-hidden" placeholder={searchPlaceholder}
                            value={search} onchange={handleSearch} oncommit={handleSearchCommit}></lightning-input>
                    </div>
                    <template lwc:if={isReleases}>
                        <div class="rr-export">
                            <lightning-button icon-name="utility:download" label={exportLabel} onclick={exportReleases} disabled={exporting}
                                title="Exports the releases matching these filters: release, title, route, raised by and on, status, approval, deploys and pull request link"></lightning-button>
                            <template lwc:if={csvHref}><a class="rr-csv rr-small" href={csvHref} download={csvName}>{csvName}</a></template>
                        </div>
                    </template>
                </section>

                <template lwc:if={showLive}>
                    <section class="rr-live" aria-label="Live status">
                        <lightning-icon icon-name="utility:refresh" size="xx-small" alternative-text=""></lightning-icon>
                        <span class="rr-small rr-weak" aria-live="off">{syncedText}</span>
                        <template lwc:if={counting}>
                            <span class="rr-meter" aria-hidden="true">
                                <template for:each={cycles} for:item="c">
                                    <span key={c.key} class="rr-meter-fill" onanimationend={handleCountdownEnd}></span>
                                </template>
                            </span>
                        </template>
                        <span class="rr-grow"></span>
                        <lightning-button label="Check now" onclick={checkNow} disabled={checkDisabled}></lightning-button>
                    </section>
                </template>

                <div class={bodyCls}>
                    <!-- list: one card per release -->
                    <template lwc:if={showList}>
                        <section class="rr-list slds-is-relative" aria-label="Release list">
                            <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
                            <template for:each={cards} for:item="r">
                                <button key={r.id} type="button" class={r.cls} data-id={r.id} aria-pressed={r.on} onclick={pick}>
                                    <span class="rr-card-top">
                                        <template lwc:if={r.isHotfix}><span class="rr-pill rr-pill-bad">Hotfix</span></template>
                                        <template lwc:if={r.typeLabel}><span class="rr-pill rr-pill-run">{r.typeLabel}</span></template>
                                        <template lwc:if={r.manualOnly}><span class="rr-pill rr-pill-run">Manual steps only</span></template>
                                        <span class="rr-no">{r.name}</span>
                                        <template lwc:if={r.deletesText}><span class="rr-pill rr-pill-bad">{r.deletesText}</span></template>
                                        <template lwc:if={r.manualText}><span class="rr-pill rr-pill-wait">{r.manualText}</span></template>
                                        <span class={r.pillCls}>{r.status}</span>
                                        <template lwc:if={r.rollbackFailed}><span class="rr-pill rr-pill-bad">Rollback failed</span></template>
                                        <span class="rr-grow"></span>
                                        <span class="rr-weak rr-small">{r.when}</span>
                                    </span>
                                    <span class="rr-card-title">{r.title}</span>
                                    <template lwc:if={r.hotfixReason}><span class="rr-reason">{r.hotfixReason}</span></template>
                                    <template lwc:if={r.carriesText}><span class="rr-weak rr-small">{r.carriesText}</span></template>
                                    <span class="rr-segs" role="img" aria-label={r.pathLabel}>
                                        <template for:each={r.steps} for:item="s">
                                            <span key={s.key} class={s.cls}></span>
                                        </template>
                                    </span>
                                    <span class="rr-card-meta">
                                        <span class="rr-route">{r.route}</span>
                                        <span class="rr-weak rr-small">{r.meta}</span>
                                    </span>
                                    <template lwc:if={r.failed}>
                                        <span class="rr-fail">
                                            <lightning-icon icon-name="utility:error" size="x-small" variant="error" alternative-text=""></lightning-icon>
                                            <span><strong>{r.failStep} failed.</strong> {r.failReason}</span>
                                        </span>
                                    </template>
                                </button>
                            </template>
                            <template lwc:if={isEmpty}><div class="rr-empty">{emptyText}</div></template>
                        </section>
                    </template>

                    <!-- detail: the selected release, with its progress and actions -->
                    <aside class="rr-detail" aria-label="Release detail">
                        <template lwc:if={hasSelection}>
                            <div class="rr-detail-bar">
                                <span class="rr-no rr-no-weak">{selectedName}</span>
                                <template lwc:if={selectedStatus}><span class={selectedPillCls}>{selectedStatus}</span></template>
                                <span class="rr-grow"></span>
                                <lightning-button-icon icon-name="utility:link" variant="border-filled" alternative-text="Copy link to this release"
                                    title="Copy link to this release" onclick={copyLink}></lightning-button-icon>
                                <lightning-button-icon icon-name={expandIcon} variant="border-filled" alternative-text={expandLabel}
                                    title={expandLabel} onclick={toggleWide}></lightning-button-icon>
                            </div>
                            <div class="rr-detail-body">
                                <c-rly-release-view release-id={selectedId} onchanged={handleChanged} onrollbackchanged={handleRollbackChanged}></c-rly-release-view>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="rr-empty rr-empty-flat">Select a release to see where it is.</div>
                        </template>
                    </aside>
                </div>
            </div>
        </template>
    </template>
    <template lwc:else>
        <div class="rr-wait"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
    </template>
</template>
