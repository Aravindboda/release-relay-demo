<template>
    <div class="gc">
        <template lwc:if={error}><div class="rr-msg rr-msg-bad" role="alert">{error}</div></template>
        <template lwc:if={showAddButton}>
            <div class="gc-row gc-add">
                <span class="rr-kicker gc-grow">One connection per provider. Each org picks its connection when it's registered.</span>
                <lightning-button label="Add connection" onclick={openAdd} disabled={addLocked}></lightning-button>
            </div>
        </template>

        <template lwc:if={isEditing}>
            <section class="gc-form" aria-label={formTitle} onkeydown={handleKey}>
                <div class="gc-form-head">
                    <h3 class="gc-h3">{formTitle}</h3>
                    <span class="rr-pill rr-pill-info">Editing</span>
                </div>
                <div class="gc-form-body">
                    <div class="rr-provs" role="group" aria-label="Provider">
                        <template for:each={providerTiles} for:item="p">
                            <button key={p.value} type="button" class={p.cls} aria-pressed={p.pressed} data-value={p.value} onclick={pickProvider} disabled={p.off}>
                                <strong class="rr-prov-name">{p.label}</strong><span class="rr-weak rr-small">{p.how}</span>
                            </button>
                        </template>
                    </div>
                    <div class="gc-fields">
                        <lightning-input label="Repository" data-field="Repository__c" value={form.Repository__c} onchange={handleField}
                            placeholder={repoHint} required></lightning-input>
                        <lightning-input label="Named Credential" data-field="Named_Credential__c" value={form.Named_Credential__c} onchange={handleField}
                            placeholder={credHint} field-level-help="API name of the Named Credential that holds the provider token." required></lightning-input>
                        <lightning-input label={formProvider.pipeLabel} data-field="Pipeline__c" value={form.Pipeline__c} onchange={handleField}
                            placeholder={pipeHint}></lightning-input>
                        <lightning-input label="Pipeline branch" data-field="Pipeline_Branch__c" value={form.Pipeline_Branch__c} onchange={handleField}
                            placeholder="e.g. main" field-level-help="Branch the pipeline files live on. Missing route branches are created from it." required></lightning-input>
                        <lightning-input label="Source path" data-field="Source_Path__c" value={form.Source_Path__c} onchange={handleField}
                            placeholder="e.g. force-app/main/default" required></lightning-input>
                        <lightning-input type="toggle" label="Code scan on every pull request" data-field="Code_Scan__c" checked={form.Code_Scan__c}
                            onchange={handleField} message-toggle-active="On" message-toggle-inactive="Off"></lightning-input>
                        <template lwc:if={showActive}>
                            <lightning-input type="toggle" label="Active" data-field="Active__c" checked={form.Active__c} onchange={handleField}
                                message-toggle-active="In use" message-toggle-inactive="Not in use"
                                field-level-help="Only active connections take orgs and get production's changes. Move its orgs first."></lightning-input>
                        </template>
                    </div>
                    <template lwc:if={formError}><div class="rr-msg rr-msg-bad" role="alert">{formError}</div></template>
                </div>
                <div class="gc-foot">
                    <span class="rr-kicker gc-grow">The token stays in the Named Credential. Saving checks the repository next.</span>
                    <lightning-button label="Cancel" onclick={cancelEdit} disabled={saving}></lightning-button>
                    <lightning-button variant="brand" label={saveLabel} onclick={handleSave} disabled={cantSave}></lightning-button>
                </div>
            </section>
        </template>

        <div class="gc-grid">
            <template for:each={cardList} for:item="c">
                <article key={c.key} class="gc-card" aria-label={c.title}>
                    <div class="gc-head">
                        <strong class="gc-prov">{c.title}</strong>
                        <template lwc:if={c.isMain}><span class="rr-pill rr-pill-info" title="Schedules, the nightly archive and self-update run here">Main</span></template>
                        <template lwc:if={c.inactive}><span class="rr-pill rr-pill-none">Not active</span></template>
                        <span class="gc-grow"></span>
                        <span class={c.statusCls}>{c.statusText}</span>
                    </div>
                    <dl class="gc-facts">
                        <div class="gc-fact">
                            <dt>Repository</dt>
                            <dd>
                                <template lwc:if={c.webUrl}><a class="rr-mono" href={c.webUrl} target="_blank" rel="noopener noreferrer">{c.repository}</a></template>
                                <template lwc:else><span class="rr-mono">{c.repository}</span></template>
                            </dd>
                        </div>
                        <div class="gc-fact"><dt>Named Credential</dt><dd class="rr-mono">{c.namedCredential}</dd></div>
                        <div class="gc-fact"><dt>Pipeline file</dt><dd class="rr-mono">{c.pipelineText}</dd></div>
                        <div class="gc-fact"><dt>Pipeline version</dt><dd><span class={c.versionCls}>{c.versionPill}</span></dd></div>
                        <div class="gc-fact gc-wide"><dt>Orgs · {c.orgCount}</dt><dd>{c.orgsText}</dd></div>
                    </dl>
                    <template lwc:if={c.messageText}><p class="gc-msg">{c.messageText}</p></template>
                    <template lwc:if={c.filesOpen}>
                        <div class="gc-files">
                            <c-rly-choice-chips label="How" mode="single" options={howOptions} value={filesHow} onchange={handleHow}></c-rly-choice-chips>
                            <template lwc:if={filesResultText}>
                                <p class="rr-small">{filesResultText}
                                    <template lwc:if={filesResultUrl}> <a href={filesResultUrl} target="_blank" rel="noopener noreferrer">Open</a></template>
                                </p>
                            </template>
                            <div class="gc-row">
                                <lightning-button label="Close" onclick={closeFiles} disabled={filesBusy}></lightning-button>
                                <lightning-button variant="brand" label={filesUpdateLabel} onclick={handleFilesUpdate} disabled={filesBusy}></lightning-button>
                            </div>
                        </div>
                    </template>
                    <template lwc:if={isAdmin}>
                        <div class="gc-foot">
                            <lightning-button label={c.checkLabel} data-id={c.id} onclick={handleCheck} disabled={c.cantAct}></lightning-button>
                            <lightning-button label="Edit" title="Edit this connection" data-id={c.id} onclick={openEdit} disabled={c.cantEdit}></lightning-button>
                            <lightning-button label="Create missing branches" data-id={c.id} onclick={handleBranches} disabled={c.cantAct}></lightning-button>
                            <template lwc:if={c.canUpdate}>
                                <lightning-button label="Update pipeline files" data-id={c.id} onclick={openFiles} disabled={c.cantAct}></lightning-button>
                            </template>
                        </div>
                    </template>
                </article>
            </template>
            <template for:each={notSetUpList} for:item="p">
                <article key={p.key} class="gc-card gc-empty" aria-label={p.label}>
                    <div class="gc-head">
                        <strong class="gc-prov">{p.label}</strong>
                        <span class="gc-grow"></span>
                        <span class="rr-pill rr-pill-none">Not set up</span>
                    </div>
                    <p class="rr-small rr-weak">{p.how}. Add it to send some orgs' releases through {p.label}.</p>
                    <template lwc:if={isAdmin}>
                        <div class="gc-foot">
                            <lightning-button label="Add" title={p.label} data-value={p.value} onclick={openAdd} disabled={p.cantAdd}></lightning-button>
                        </div>
                    </template>
                </article>
            </template>
        </div>
        <template lwc:if={showEmpty}><p class="rr-small rr-weak">No Git connection yet. Add one to choose the provider and repository.</p></template>
    </div>
</template>
