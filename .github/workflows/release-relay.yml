# Release Relay pipeline files: version 15
# Version 15: a nightly schedule (on.schedule, 08:00 UTC = 2:00 AM Central in winter) runs the archive job: it signs in
# to the hub and calls POST /services/apexrest/rly/archive once per pass (at most 25) until the hub says done. The hub
# removes finished releases older than its Retention days only when "Archive every night" is on; every other job skips
# on the schedule. Hub environment: vars.RELAY_HUB_ENVIRONMENT (default prod).
# Version 14: a promotion can take each changed file as it is in the previous stage (options.stageBranch) and stops on
# a hotfix the stage doesn't have (raise.json "clash"); changes can be added to an open release (mode hub with
# options.append and options.appendZip; raise.json "appended").
# Version 13: per-org values (.relay/values.json: {{relay:NAME}} placeholders filled per target org at deploy time,
# turned back into placeholders when org metadata is written to a branch), quality gates (.relay/gates.json: scan
# priority, Apex coverage, tests required for Apex), rollback snapshots before every deploy (release-relay-snapshots
# branch) and mode=rollback, and a cached Salesforce CLI.
# Release Relay's own metadata (its components by exact name, plus .relay/exclude) is never validated, deployed or deleted;
# options {"selfUpdate":true} (the hub updating itself, from the release-relay-hub branch) ignores the list.
# Release Relay: started from Salesforce (workflow_dispatch), and every night by the schedule (archive job only).
#   archive      (schedule only) ask the hub to archive finished releases older than its Retention days, one
#                pass per call, logging each pass; the hub skips when "Archive every night" is off.
#   mode=org     retrieve the selected components from the source org, apply deletions, commit to a
#                new branch, open a pull request into the target branch, then scan and validate it.
#   mode=branch  open a pull request from a branch that already exists, then scan and validate it.
#   mode=promote make a promote/ branch from the target with each file the merge commits listed in
#                components changed, as it is in options.stageBranch (the previous stage; without it the
#                commits are cherry-picked), open a pull request, then scan and validate it.
#   mode=hub     the Release Relay hub committed its retrieve (a Metadata API zip) to the branch:
#                convert it to source format (none for a release with only deletions,
#                a .relay-inbox/<id>.deletions marker instead), remove the deleted components' files,
#                open a pull request into the target, scan and validate.
#                options {"append":true,"appendZip":".relay-inbox/<id>-add-<k>.zip"}: add that zip's changes to the
#                open release's branch (no new pull request), then scan and validate again.
#   mode=resolve merge the target into the branch with the conflict choices the hub committed, then
#                scan and validate again.
#   mode=check   scan and validate an open pull request again (after a fix, or on request).
#   mode=merge   merge the pull request approved in Salesforce, then deploy it to the target org,
#                then merge the target into the branches in options.syncBranches (each one directly).
#   mode=sync    back promote: merge branch (the hub's production branch) into target (a back-promote
#                org's branch, made from branch when missing), deploy what changed to the org in
#                target_environment, and push target only when that deploy worked (results/<id>/sync.json).
#   mode=rollback deploy a snapshot taken before an earlier deploy back into the org in target_environment
#                (options.snapshotPath, else the latest for the release and environment); branch, target and title
#                aren't used (send the target org's branch and a short title). Writes results/<id>/rollback.json.
# Validation and deployment run only when Salesforce passes a target environment (the GitHub
# environment that holds the target org's login). Each step writes its result as JSON to the
# release-relay-results branch, where Salesforce reads it.
# options (JSON, from Salesforce): {"scan":"off"} skips the code scan; {"hub":true} skips the
# ALLOWED_TARGETS check (the hub enforces its route); {"tests":[...]} sets the test classes
# (RunSpecifiedTests, or NoTestRun when empty); {"validateMerged":true} validates the branch merged
# with the target; {"attempt":"..."} is the hub's run token, echoed in every result;
# {"syncBranches":[...]} and {"stageWins":true} are for merge; {"notify":"dev"} makes the
# last job tell that org (signing in with that environment's login) to read the results at once;
# {"snapshot":false} skips the rollback snapshot before a deploy; {"snapshotPath":"REL-00042/prod/<id>"} picks
# the snapshot for mode=rollback.
name: Release Relay
run-name: "${{ github.event_name == 'schedule' && 'Release Relay nightly archive' || format('Release Relay {0} ({1})', inputs.request_id, inputs.mode) }}"

on:
  # Nightly archive. Cron is UTC: 0 8 * * * is 2:00 AM Central in winter (CST), 3:00 AM in summer (CDT); change the
  # hour to your quiet time. GitHub may start it a few minutes late.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: Salesforce release number
        required: true
        type: string
      mode:
        description: org, branch, promote, hub, resolve, check, merge, sync or rollback
        required: true
        type: choice
        options: [org, branch, promote, hub, resolve, check, merge, sync, rollback]
      environment:
        description: GitHub environment of the source org (sync = the hub's production org)
        required: true
        type: string
      target_environment:
        description: GitHub environment of the target org (blank = Git only, no validate or deploy)
        required: false
        type: string
        default: ''
      branch:
        description: Source branch (sync = the hub's production branch)
        required: true
        type: string
      target:
        description: Target branch (sync = the back-promote org's branch)
        required: true
        type: string
      title:
        description: Pull request title
        required: true
        type: string
      components:
        description: Type:Name list to retrieve, comma separated (promote = the releases' merge commits)
        required: false
        type: string
        default: ''
      deletions:
        description: Type:Name list to delete, comma separated
        required: false
        type: string
        default: ''
      options:
        description: 'JSON options from Salesforce, for example {"scan":"off","notify":"dev"}'
        required: false
        type: string
        default: '{}'

permissions:
  contents: write
  pull-requests: write

# One run at a time per release branch; back promotes, one at a time per back-promote branch; rollbacks, one at
# a time per org; the nightly archive, one at a time.
concurrency:
  group: release-relay-${{ github.event_name == 'schedule' && 'archive' || (inputs.mode == 'rollback' && format('rollback-{0}', inputs.target_environment) || (inputs.mode == 'sync' && inputs.target || inputs.branch)) }}
  cancel-in-progress: false

env:
  RELAY_PROVIDER: github
  REQUEST_ID: ${{ inputs.request_id }}
  MODE: ${{ inputs.mode }}
  ENVIRONMENT: ${{ inputs.environment }}
  TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
  BRANCH: ${{ inputs.branch }}
  TARGET: ${{ inputs.target }}
  TITLE: ${{ inputs.title }}

jobs:
  raise:
    if: ${{ inputs.mode == 'org' || inputs.mode == 'branch' || inputs.mode == 'promote' || inputs.mode == 'hub' || inputs.mode == 'resolve' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      # Optional: a GitHub App token, so the new pull request triggers your own PR checks.
      - name: Create GitHub App token
        id: app
        if: ${{ vars.RELAY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELAY_APP_ID }}
          private-key: ${{ secrets.RELAY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        if: ${{ (inputs.mode == 'org' && inputs.components != '') || inputs.mode == 'hub' }}
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        if: ${{ (inputs.mode == 'org' && inputs.components != '') || inputs.mode == 'hub' }}
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        if: ${{ (inputs.mode == 'org' && inputs.components != '') || inputs.mode == 'hub' }}
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      # Inputs reach the script only as environment variables, never inside a shell command.
      - name: Raise pull request
        env:
          STEP: raise
          OPTIONS: ${{ inputs.options }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          COMPONENTS: ${{ inputs.components }}
          DELETIONS: ${{ inputs.deletions }}
          ORG_LABEL: ${{ vars.ORG_LABEL }}
          ALLOWED_TARGETS: ${{ vars.ALLOWED_TARGETS }}
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          WRITE_DESTRUCTIVE_MANIFEST: ${{ vars.WRITE_DESTRUCTIVE_MANIFEST }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        run: node scripts/release-relay.js

  scan:
    needs: raise
    if: ${{ !cancelled() && fromJSON(inputs.options || '{}').scan != 'off' && (needs.raise.result == 'success' || inputs.mode == 'check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The Salesforce CLI and the Code Analyzer plugin are cached per runner OS and month.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-scan-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI and Code Analyzer
        uses: actions/cache@v4
        with:
          path: |
            ~/.relay-sf
            ~/.local/share/sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          export PATH="$HOME/.relay-sf/bin:$PATH"
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
          sf plugins 2>/dev/null | grep -q 'code-analyzer' || sf plugins install code-analyzer
      - name: Code scan
        env:
          STEP: scan
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          SCAN_RULES: ${{ vars.SCAN_RULES }}
          SCAN_BLOCK_SEVERITY: ${{ vars.SCAN_BLOCK_SEVERITY }}
        # The release branch may hold an older copy of the script: always run the pipeline's own.
        run: |
          git show "$GITHUB_SHA:scripts/release-relay.js" > "$RUNNER_TEMP/release-relay.js"
          node "$RUNNER_TEMP/release-relay.js"

  validate:
    needs: raise
    if: ${{ !cancelled() && inputs.target_environment != '' && (needs.raise.result == 'success' || inputs.mode == 'check') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Validate against the target org
        env:
          STEP: validate
          OPTIONS: ${{ inputs.options }}
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          DEPLOY_TEST_LEVEL: ${{ vars.DEPLOY_TEST_LEVEL }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        # The release branch may hold an older copy of the script: always run the pipeline's own.
        run: |
          git show "$GITHUB_SHA:scripts/release-relay.js" > "$RUNNER_TEMP/release-relay.js"
          node "$RUNNER_TEMP/release-relay.js"

  merge:
    if: ${{ inputs.mode == 'merge' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Create GitHub App token
        id: app
        if: ${{ vars.RELAY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELAY_APP_ID }}
          private-key: ${{ secrets.RELAY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge the approved pull request
        id: merge
        env:
          STEP: merge
          OPTIONS: ${{ inputs.options }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ALLOWED_TARGETS: ${{ vars.ALLOWED_TARGETS }}
          MERGE_METHOD: ${{ vars.MERGE_METHOD }}
        run: node scripts/release-relay.js

  deploy:
    needs: merge
    if: ${{ inputs.target_environment != '' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 120
    steps:
      # The deploy needs only the merge commit and its parents (the diff it deploys), not the whole history,
      # plus the pipeline's own commit for the script and its .relay files.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 2
      - name: Fetch the pipeline's commit
        run: git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Deploy to the target org
        env:
          STEP: deploy
          OPTIONS: ${{ inputs.options }}
          MERGE_SHA: ${{ needs.merge.outputs.sha }}
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          DEPLOY_TEST_LEVEL: ${{ vars.DEPLOY_TEST_LEVEL }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        # The release branch may hold an older copy of the script: always run the pipeline's own.
        run: |
          git show "$GITHUB_SHA:scripts/release-relay.js" > "$RUNNER_TEMP/release-relay.js"
          node "$RUNNER_TEMP/release-relay.js"

  # Back promote: production's changes into a back-promote org. Runs in the target org's environment,
  # like deploy, so its login (and any protection rules on that environment) apply.
  sync:
    if: ${{ inputs.mode == 'sync' && inputs.target_environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 120
    steps:
      # Optional: a GitHub App token, when branch rules only let the app push to the back-promote branch.
      - name: Create GitHub App token
        id: app
        if: ${{ vars.RELAY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELAY_APP_ID }}
          private-key: ${{ secrets.RELAY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Back promote to the target org
        env:
          STEP: sync
          OPTIONS: ${{ inputs.options }}
          ALLOWED_TARGETS: ${{ vars.ALLOWED_TARGETS }}
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          DEPLOY_TEST_LEVEL: ${{ vars.DEPLOY_TEST_LEVEL }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        # The script checks out other branches: run a copy of the pipeline's own from outside the checkout.
        run: |
          git show "$GITHUB_SHA:scripts/release-relay.js" > "$RUNNER_TEMP/release-relay.js"
          node "$RUNNER_TEMP/release-relay.js"

  # Rollback: deploys a snapshot (taken before an earlier deploy) back into the org. Runs in the target org's
  # environment, like deploy, so its login and protection rules apply. Release branches aren't touched.
  rollback:
    if: ${{ inputs.mode == 'rollback' && inputs.target_environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 120
    steps:
      # Only the pipeline's commit is needed: the snapshot is read from release-relay-snapshots.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Roll back the target org
        env:
          STEP: rollback
          OPTIONS: ${{ inputs.options }}
          SOURCE_PATH: ${{ vars.SOURCE_PATH }}
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        run: |
          git show "$GITHUB_SHA:scripts/release-relay.js" > "$RUNNER_TEMP/release-relay.js"
          node "$RUNNER_TEMP/release-relay.js"

  # Tells the Salesforce org that raised the release to read the results now, instead of waiting
  # for its scheduled sync. Signs in with that org's environment; a failure here never fails the run.
  notify:
    needs: [raise, scan, validate, merge, deploy, sync, rollback]
    if: ${{ always() && fromJSON(inputs.options || '{}').notify != null && fromJSON(inputs.options || '{}').notify != '' }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(inputs.options || '{}').notify }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Tell Salesforce the run finished
        env:
          STEP: notify
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
        run: node scripts/release-relay.js

  # Nightly archive (schedule only): signs in to the hub with its environment's login (as the other jobs do) and
  # calls the archive endpoint once per pass until it answers done (at most 25 calls). Each call's answer is logged.
  # The hub decides: it skips (and says why) unless it is the production hub, the user has Release Relay Admin,
  # "Archive every night" is on and Retention days are set. No script from the repository is needed.
  archive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    environment: ${{ vars.RELAY_HUB_ENVIRONMENT || 'prod' }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Salesforce CLI (major version 2) is cached per runner OS and month, so most runs skip the install.
      - name: Salesforce CLI cache key
        id: sfkey
        run: echo "key=relay-sf-cli2-${RUNNER_OS}-node22-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.relay-sf
          key: ${{ steps.sfkey.outputs.key }}
      - name: Install Salesforce CLI
        run: |
          [ -x "$HOME/.relay-sf/bin/sf" ] || npm install --global --prefix "$HOME/.relay-sf" @salesforce/cli@2 --no-audit --no-fund
          echo "$HOME/.relay-sf/bin" >> "$GITHUB_PATH"
      - name: Archive finished releases in the hub
        env:
          SF_INSTANCE_URL: ${{ vars.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_JKS: ${{ secrets.SF_JKS }}
          SF_JKS_PASSWORD: ${{ secrets.SF_JKS_PASSWORD }}
          SF_JKS_ALIAS: ${{ vars.SF_JKS_ALIAS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Secrets reach the shell only as environment variables. The key is written like the script does it:
        # SF_JKS (keystore, base64) with SF_JKS_PASSWORD and SF_JKS_ALIAS, or SF_JWT_KEY (base64 PEM private key).
        run: |
          set -euo pipefail
          for name in SF_USERNAME SF_CLIENT_ID SF_INSTANCE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name isn't set for the hub's environment."
              exit 1
            fi
          done
          key="$RUNNER_TEMP/relay.key"
          if [ -n "${SF_JKS:-}" ]; then
            if [ -z "${SF_JKS_PASSWORD:-}" ] || [ -z "${SF_JKS_ALIAS:-}" ]; then
              echo "::error::SF_JKS is set, so SF_JKS_PASSWORD (secret) and SF_JKS_ALIAS (variable) are needed too."
              exit 1
            fi
            dir="$(mktemp -d)"
            printf '%s' "$SF_JKS" | base64 -d > "$dir/store.jks"
            export RELAY_PW="$SF_JKS_PASSWORD"
            keytool -importkeystore -noprompt -srckeystore "$dir/store.jks" -srcstoretype JKS -srcstorepass:env RELAY_PW \
              -srckeypass:env RELAY_PW -srcalias "$SF_JKS_ALIAS" -destkeystore "$dir/store.p12" -deststoretype PKCS12 \
              -deststorepass:env RELAY_PW -destkeypass:env RELAY_PW > /dev/null
            openssl pkcs12 -in "$dir/store.p12" -nocerts -nodes -passin env:RELAY_PW -out "$key" 2> /dev/null
            rm -rf "$dir"
          elif [ -n "${SF_JWT_KEY:-}" ]; then
            printf '%s' "$SF_JWT_KEY" | base64 -d > "$key"
          else
            echo "::error::Set SF_JKS (keystore from Salesforce) or SF_JWT_KEY (private key) for the hub's environment."
            exit 1
          fi
          chmod 600 "$key"
          sf org login jwt --client-id "$SF_CLIENT_ID" --username "$SF_USERNAME" --jwt-key-file "$key" \
            --instance-url "$SF_INSTANCE_URL" --alias relay-hub > /dev/null
          rm -f "$key"
          org="$(sf org display --target-org relay-hub --json)"
          token="$(printf '%s' "$org" | jq -r '.result.accessToken')"
          echo "::add-mask::$token"
          base="$(printf '%s' "$org" | jq -r '.result.instanceUrl' | sed 's:/*$::')"
          run_id=""
          for call in $(seq 1 25); do
            body="$(jq -n --arg runUrl "$RUN_URL" --arg runId "$run_id" \
              '{runUrl: $runUrl} + (if $runId == "" then {} else {runId: $runId} end)')"
            answer="$(curl -sS --fail-with-body -X POST "$base/services/apexrest/rly/archive" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body")"
            if [ "$(printf '%s' "$answer" | jq -r '.skipped')" = "true" ]; then
              echo "Call $call: $(printf '%s' "$answer" | jq -r '.reason')"
              echo "Nightly archive: $(printf '%s' "$answer" | jq -r '.reason')" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            line="$(printf '%s' "$answer" | jq -r '"Pass \(.pass): \(.removed) releases, \(.records) records removed, \(.remaining // "?") eligible left. \(.reason // "")"')"
            echo "$line"
            echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            run_id="$(printf '%s' "$answer" | jq -r '.runId // ""')"
            if [ "$(printf '%s' "$answer" | jq -r '.done')" = "true" ]; then
              case "$line" in
                *" failed: "*) echo "::warning::The archive pass failed; the hub's Archive tab has the details. The next night carries on." ;;
              esac
              break
            fi
          done
