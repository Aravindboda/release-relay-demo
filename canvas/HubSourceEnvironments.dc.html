body{margin:0;background:#F3F3F3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#181818}
.card{background:#fff;border:1px solid #E5E5E5;border-radius:4px}
.k{margin:0;font-size:12px;color:#5C5C5C}.weak{color:#5C5C5C}.sm{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700}
.wait{background:#FEF1CD;color:#8C4B02}
.envs{border:1px solid #E5E5E5;border-radius:4px}
.env{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;padding:12px;border-top:1px solid #E5E5E5}.env:first-child{border-top:0}
.env h3{margin:0;font-size:13px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.src{min-width:220px;display:flex;flex-direction:column;gap:4px;border:1px solid #E5E5E5;border-radius:4px;padding:10px 12px;background:#fff}
.src strong{font-size:16px}.on{border:2px solid #0176D3;background:#EEF4FF;padding:9px 11px}.stop{background:#FAFAF9}
.none{font-size:13px;color:#5C5C5C}

.btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid #0176D3;background:#0176D3;color:#fff;font:inherit;font-size:13px}

  </section>

  <p class="lab" style="margin-top:12px">Screen 2 · step 2 of 5</p>
  <section class="card" style="padding:12px 16px;display:flex;align-items:center"><div style="flex:1"><p class="k">Release Relay hub · New release · step 2 of 5</p><h1 style="margin:2px 0 0;font-size:18px">Which Developer sandbox org?</h1></div><button class="btn2">Back</button></section>

    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">

      <div class="orgs"><div class="org on"><span class="r"></span><b>DEV1</b><span class="mono weak">dev1</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div><div class="org"><span class="r"></span><b>DEV2</b><span class="mono weak">dev2</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div><div class="org"><span class="r"></span><b>DEV3</b><span class="mono weak">dev3</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div><div class="org"><span class="r"></span><b>DEV4</b><span class="mono weak">dev4</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div><div class="org"><span class="r"></span><b>DEV5</b><span class="mono weak">dev5</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div><div class="org"><span class="r"></span><b>DEV6</b><span class="mono weak">dev6</span><span class="sm weak" style="flex:1">Metadata API · → SIT</span></div></div>
      <p style="margin:0;font-size:13px">Goes to → <strong>SIT · sit</strong> <span class="weak">(the first stage of the route)</span></p>
      <div class="row" style="gap:24px"><div><p class="k">Changed</p><div class="seg"><span class="s">Last 7 days</span><span>Last 30 days</span><span>Any time</span><span>Since a date…</span></div></div>
        <div><p class="k">Changed by</p><div class="seg"><span class="s">Me</span><span>Anyone</span></div></div></div>
    </div>
    <div style="padding:10px 16px;border-top:1px solid #E5E5E5;background:#F3F3F3;display:flex;justify-content:flex-end"><button class="btn">Next: find changes</button></div>
  </section>
</div>
v class="row"><span class="none">None registered</span></div></div>
      <div class="env"><div><h3>Full Copy sandbox</h3><p class="k">Copy of production · refresh every 29 days</p></div>
        <div class="row"><div class="src"><span class="row" style="gap:6px"><strong>SIT</strong><span class="pill wait">Hotfix</span></span><span class="mono weak">sit</span><span class="sm weak">→ PROD, skips no checks</span></div></div></div>

      <div><p class="k">Changed by</p><div class="seg"><span class="s">Me</span><span>Anyone</span></div></div></div>

  </section>
</div>
